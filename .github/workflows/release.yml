name: Release

# A pull request from dev to main builds the release it would publish; merging it, or running this by hand on main, publishes that build.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      releasing: ${{ steps.notes.outputs.releasing }}
      version: ${{ steps.version.outputs.name }}
    steps:
      - name: Refuse a pull request from anywhere but dev
        if: github.head_ref != 'dev'
        run: |
          echo "main takes pull requests from dev only, not from ${{ github.head_ref }}" >&2
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A merge is a release only when the changelog has notes under [Unreleased]; one without, a README or a past version's notes, reaches main building nothing.
      - name: Read the release's notes from the changelog
        id: notes
        run: |
          mkdir "$RUNNER_TEMP/release"
          awk '$0 == "## [Unreleased]" { found = 1; next } found && (/^## / || /^\[[^]]+\]: /) { exit } found' CHANGELOG.md > "$RUNNER_TEMP/release/notes.md"
          if grep -q '[^[:space:]]' "$RUNNER_TEMP/release/notes.md"; then
            echo "releasing=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing under ## [Unreleased]: this merge is no release and builds nothing."
            echo "releasing=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.notes.outputs.releasing == 'true'
        with:
          distribution: temurin
          java-version: |
            17
            25
      - uses: gradle/actions/setup-gradle@v4
        if: steps.notes.outputs.releasing == 'true'

      # The next minor where the notes add or remove something, the next patch where they only change or fix.
      - name: Choose the version being released
        if: steps.notes.outputs.releasing == 'true'
        id: version
        run: |
          IFS=. read -r major minor patch <<< "$(sed -n 's/^worscanner.released=//p' gradle.properties)"
          if grep -qE '^### (Added|Removed)$' "$RUNNER_TEMP/release/notes.md"; then
            echo "name=$major.$((minor + 1)).0" >> "$GITHUB_OUTPUT"
          else
            echo "name=$major.$minor.$((patch + 1))" >> "$GITHUB_OUTPUT"
          fi

      - name: Refuse a version already released
        if: steps.notes.outputs.releasing == 'true'
        run: |
          if git rev-parse -q --verify "refs/tags/v${{ steps.version.outputs.name }}" > /dev/null; then
            echo "v${{ steps.version.outputs.name }} is already released" >&2
            exit 1
          fi

      # The Android app is paused: its tests still run, but no APK is built or released.
      - name: Test
        if: steps.notes.outputs.releasing == 'true'
        run: ./gradlew test

      - name: Keep what the merge publishes
        if: steps.notes.outputs.releasing == 'true'
        run: echo "${{ steps.version.outputs.name }}" > "$RUNNER_TEMP/release/version"
      - uses: actions/upload-artifact@v4
        if: steps.notes.outputs.releasing == 'true'
        with:
          name: release
          path: ${{ runner.temp }}/release

  # The Windows app, the release's one download, is built on Windows and kept for the merge to publish.
  windows:
    needs: release
    if: github.event_name == 'pull_request' && github.head_ref == 'dev' && needs.release.outputs.releasing == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            25
      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build the Windows app
        run: ./gradlew :windows:test :windows:createDistributable -Pworscanner.released=${{ needs.release.outputs.version }}

      - name: Zip the app's folder
        run: 7z a "$RUNNER_TEMP/wor-scanner-windows.zip" "./windows/build/compose/binaries/main/app/WoR Scanner"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: ${{ runner.temp }}/wor-scanner-windows.zip

  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The merge commit's second parent is the head the pull request's check built.
      - name: Find the pull request's build of what was merged
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(git rev-parse HEAD^2)
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?event=pull_request&status=success&head_sha=$head" --jq '.workflow_runs[0].id // empty')
          if [ -z "$run" ]; then
            echo "no pull request built $head" >&2
            exit 1
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" --jq '.artifacts[].name' | grep -qx release; then
            echo "releasing=true" >> "$GITHUB_OUTPUT"
          else
            echo "Its pull request built nothing: this merge is no release."
            echo "releasing=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.build.outputs.releasing == 'true'
        with:
          name: release
          run-id: ${{ steps.build.outputs.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release
      - uses: actions/download-artifact@v4
        if: steps.build.outputs.releasing == 'true'
        with:
          name: release-windows
          run-id: ${{ steps.build.outputs.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release

      - name: Read the version being released
        if: steps.build.outputs.releasing == 'true'
        id: version
        run: echo "name=$(cat "$RUNNER_TEMP/release/version")" >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub release
        if: steps.build.outputs.releasing == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        working-directory: ${{ runner.temp }}/release
        run: |
          gh release create "v$VERSION" "wor-scanner-windows.zip" --repo "$GITHUB_REPOSITORY" \
            --title "v$VERSION" --notes-file notes.md --target "$GITHUB_SHA"

      # dev records the version as released and dates what was unreleased.
      - name: Record the release on dev
        if: steps.build.outputs.releasing == 'true'
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          git switch dev
          sed -i "s/^worscanner.released=.*$/worscanner.released=$VERSION/" gradle.properties
          sed -i \
            -e "s/^## \[Unreleased\]$/## [Unreleased]\n\n## [$VERSION] - $(date -u +%F)/" \
            -e "s|^\[unreleased\]: \(.*\)/compare/\(v[0-9.]*\)\.\.\.HEAD$|[unreleased]: \1/compare/v$VERSION...HEAD\n[$VERSION]: \1/compare/\2...v$VERSION|" \
            CHANGELOG.md
          if git diff --quiet; then
            echo "dev already records $VERSION"
            exit 0
          fi
          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit -am "Released $VERSION"
          git push origin HEAD:dev
