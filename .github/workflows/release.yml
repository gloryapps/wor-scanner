name: Release

# A pull request from dev to main builds the release it would publish; merging it, or running this by hand on main, publishes it.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse a pull request from anywhere but dev
        if: github.event_name == 'pull_request' && github.head_ref != 'dev'
        run: |
          echo "main takes pull requests from dev only, not from ${{ github.head_ref }}" >&2
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            25
      - uses: gradle/actions/setup-gradle@v4

      - name: Read the version being released
        id: version
        run: echo "name=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Refuse a version already released
        run: |
          if git rev-parse -q --verify "refs/tags/v${{ steps.version.outputs.name }}" > /dev/null; then
            echo "v${{ steps.version.outputs.name }} is already released" >&2
            exit 1
          fi

      - name: Read the version's notes from the changelog
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          awk -v heading="## $VERSION" '$0 == heading { found = 1; next } found && /^## / { exit } found' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "CHANGELOG.md has no notes under ## $VERSION" >&2
            exit 1
          fi

      - name: Write the keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Test and build the signed release
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew test :app:assembleRelease

      - name: Publish the GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "wor-scanner.apk"
          gzip -9 -c app/build/outputs/mapping/release/mapping.txt > "mapping-$VERSION.txt.gz"
          gh release create "v$VERSION" "wor-scanner.apk" "mapping-$VERSION.txt.gz" \
            --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md" --target "$GITHUB_SHA"

      # dev moves to the next minor; a patch or a major is set on dev by hand before its pull request.
      - name: Start the next version on dev
        if: github.ref == 'refs/heads/main'
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          git switch dev
          IFS=. read -r major minor patch <<< "$VERSION"
          next="$major.$((minor + 1)).0"
          sed -i "s/versionName = \"$VERSION\"/versionName = \"$next\"/" app/build.gradle.kts
          if git diff --quiet; then
            echo "dev is already past $VERSION"
            exit 0
          fi
          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit -am "Start $next"
          git push origin HEAD:dev
