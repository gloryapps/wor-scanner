name: Release

on:
  workflow_dispatch:
    inputs:
      next:
        description: Part of the version dev moves to once this one is released
        type: choice
        options: [patch, minor, major]
        default: minor

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Read the version dev is on
        id: version
        run: echo "name=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Refuse a version already released
        run: |
          if git rev-parse -q --verify "refs/tags/v${{ steps.version.outputs.name }}" > /dev/null; then
            echo "v${{ steps.version.outputs.name }} is already released" >&2
            exit 1
          fi

      - name: Write the keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Test and build the signed release
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew test :app:assembleRelease

      - name: Advance main and publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          git push origin HEAD:main
          cp app/build/outputs/apk/release/app-release.apk "wor-scanner-$VERSION.apk"
          cp app/build/outputs/mapping/release/mapping.txt "mapping-$VERSION.txt"
          gh release create "v$VERSION" "wor-scanner-$VERSION.apk" "mapping-$VERSION.txt" \
            --title "v$VERSION" --generate-notes --target "$(git rev-parse HEAD)"

      - name: Start the next version on dev
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          IFS=. read -r major minor patch <<< "$VERSION"
          case "${{ inputs.next }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          next="$major.$minor.$patch"
          sed -i "s/versionName = \"$VERSION\"/versionName = \"$next\"/" app/build.gradle.kts
          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit -am "Start $next"
          git push origin HEAD:dev
