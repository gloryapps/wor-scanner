name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Part of the version to bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Bump the version
        id: version
        run: |
          last=$(git tag --list 'v*' --sort=-v:refname | head -1)
          IFS=. read -r major minor patch <<< "${last#v}"
          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          echo "name=${major:-0}.${minor:-0}.$patch" >> "$GITHUB_OUTPUT"

      - name: Write the keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Test and build the signed release
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew test :app:assembleRelease -PversionName=${{ steps.version.outputs.name }}

      - name: Advance main and publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          git push origin HEAD:main
          cp app/build/outputs/apk/release/app-release.apk "wor-scanner-$VERSION.apk"
          cp app/build/outputs/mapping/release/mapping.txt "mapping-$VERSION.txt"
          gh release create "v$VERSION" "wor-scanner-$VERSION.apk" "mapping-$VERSION.txt" \
            --title "v$VERSION" --generate-notes --target "$(git rev-parse HEAD)"
