name: Windows

# Run by hand on any branch: tests the Windows app against a real Windows desktop and keeps what it saw.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            25
      - uses: gradle/actions/setup-gradle@v4

      - name: Test the Windows app on the desktop
        run: ./gradlew :windows:test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test
          path: |
            windows/build/reports/tests/test
            windows/build/desktop-test
