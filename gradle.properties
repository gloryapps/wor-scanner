kotlin.code.style=official
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
android.nonTransitiveRClass=true
android.useAndroidX=true
# The app's name as every platform shows it: Android's label, the Windows window's title.
worscanner.name=WoR Scanner
# The version every platform is building; the release workflow reads it and moves dev to the next.
worscanner.version=0.4.0
# The lab every release reaches; `-Pazhor.url=http://<the PC's address>:5173` points a build at the lab running on the PC.
azhor.url=https://azhor-wor.netlify.app
