kotlin.code.style=official
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
android.nonTransitiveRClass=true
android.useAndroidX=true
# The app's name as every platform shows it: Android's label, the Windows window's title.
worscanner.name=WoR Scanner
# The version last released, which every platform builds as; a release builds the next, chosen by its changelog notes, and writes it here once published.
worscanner.released=0.6.1
# The lab every release reaches; `-Pazhor.url=http://<the PC's address>:5173` points a build at the lab running on the PC.
azhor.url=https://azhor-wor.netlify.app
# `-Pworscanner.dev=true` makes a dev build, named "<name> Dev": on Windows, its own window, folder and link beside the released app.
